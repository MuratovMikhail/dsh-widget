name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Engine syntax and tests
        shell: pwsh
        run: |
          node --check widget-engine.js
          node tools/test-subagents.js
          node tools/test-selection.js
          node tools/test-ack.js
          node tools/test-content.js
          node tools/test-widgetdir.mjs

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable archive and installer
        shell: powershell
        run: |
          .\release.ps1
          .\build-installer.ps1
          $version = (Get-Content -LiteralPath VERSION -Raw -Encoding UTF8).Trim()
          if (-not (Test-Path -LiteralPath "dsh-widget-$version.zip")) { throw "ZIP not found for $version" }
          if (-not (Test-Path -LiteralPath "dist\DSHWidget-Setup-$version.exe")) { throw "EXE not found for $version" }

      - name: SHA256 checksums
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw -Encoding UTF8).Trim()
          $files = @("dsh-widget-$version.zip", "dist\DSHWidget-Setup-$version.exe")
          $rows = foreach ($f in $files) {
            $h = Get-FileHash -LiteralPath $f -Algorithm SHA256
            $h.Hash + '  ' + [IO.Path]::GetFileName($f)
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'SHA256SUMS.txt'), $rows, (New-Object Text.UTF8Encoding($false)))

      # Тело релиза — только изменения этой версии: полная история остаётся в CHANGELOG.md,
      # иначе страница релиза растягивается и кнопки скачивания уезжают вниз.
      - name: Release notes for this version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw -Encoding UTF8).Trim()
          $lines = @(Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8)
          $heading = '^##\s+' + [regex]::Escape($version) + '(\s|$)'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }
          if ($start -lt 0) { throw "В CHANGELOG.md нет секции $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { $end = $i; break }
          }
          if ($end -le $start + 1) { throw "Секция $version в CHANGELOG.md пуста" }
          $section = @($lines[($start + 1)..($end - 1)])
          $first = 0
          while ($first -lt $section.Count -and [string]::IsNullOrWhiteSpace($section[$first])) { $first++ }
          if ($first -ge $section.Count) { throw "Секция $version в CHANGELOG.md пуста" }
          $section = @($section[$first..($section.Count - 1)])
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $body = @(
            ($section -join "`n").TrimEnd(),
            '',
            '---',
            '',
            "Full history: [CHANGELOG.md](https://github.com/$repo/blob/main/CHANGELOG.md)",
            "Downloads: [installer](https://github.com/$repo/releases/download/$tag/DSHWidget-Setup-$version.exe) · [portable zip](https://github.com/$repo/releases/download/$tag/dsh-widget-$version.zip)"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'release-body.md'), $body + "`n", (New-Object Text.UTF8Encoding($false)))
          Write-Output ("release-body.md: версия $version, $($section.Count) строк")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Widget ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            dsh-widget-*.zip
            dist/DSHWidget-Setup-*.exe
            SHA256SUMS.txt
